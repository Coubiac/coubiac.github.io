44.292" fill="#000" font-size="14" textLength="221.163">RCPT TO:&lt;user@example.net></text></g><!--entity RAT--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.RAT" id="ent0011" data-source-line="24"><rect x="1476" y="189.797" width="277.298" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1486" y="212.792" fill="#000" font-size="14" textLength="27.856">RAT</text><text x="1486" y="229.089" fill="#000" font-size="14" textLength="257.298">Cette destination est-elle acceptée ?</text></g><!--entity LDAP--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.LDAP" id="ent0012" data-source-line="25"><rect x="1813" y="216.797" width="212.903" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1823" y="239.792" fill="#000" font-size="14" textLength="192.903">LDAP Recipient Acceptance</text><text x="1823" y="256.089" fill="#000" font-size="14" textLength="188.679">Ce destinataire existe-t-il ?</text><text x="1823" y="272.386" fill="#000" font-size="14" textLength="76.569">(optionnel)</text></g><!--entity ACCEPT--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.ACCEPT" id="ent0013" data-source-line="26"><rect x="2086" y="197.797" width="208.405" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="2096" y="220.792" fill="#000" font-size="14" textLength="38.486">DATA</text><text x="2096" y="237.089" fill="#000" font-size="14" textLength="188.405">Le message peut être reçu</text></g><!--entity HATCRIT--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.HAT.HATCRIT" id="ent0005" data-source-line="15"><rect x="299.5" y="193.297" width="176.646" height="117.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="309.5" y="216.292" fill="#000" font-size="14" textLength="156.646">Critères Sender Group</text><text x="309.5" y="232.589" fill="#000" font-size="14" textLength="73.917">IP / réseau</text><text x="309.5" y="248.886" fill="#000" font-size="14" textLength="146.241">Hostname / domaine</text><text x="309.5" y="265.183" fill="#000" font-size="14" textLength="59.063">DNS List</text><text x="309.5" y="281.479" fill="#000" font-size="14" textLength="89.694">Organisation</text><text x="309.5" y="297.776" fill="#000" font-size="14" textLength="144.505">Talos / IP Reputation</text></g><!--entity SG--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.HAT.SG" id="ent0006" data-source-line="16"><rect x="599" y="225.797" width="185.163" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="609" y="248.792" fill="#000" font-size="14" textLength="97.009">Sender Group</text><text x="609" y="265.089" fill="#000" font-size="14" textLength="165.163">Dans quelle catégorie ?</text></g><!--entity MFP--><g class="entity" data-qualified-name="Cisco Secure Email Gateway.HAT.MFP" id="ent0007" data-source-line="17"><rect x="844" y="197.797" width="271.398" height="101.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="854" y="220.792" fill="#000" font-size="14" textLength="110.065">Mail Flow Policy</text><text x="854" y="237.089" fill="#000" font-size="14" textLength="239.388">Comment traiter cette catégorie ?</text><text x="854" y="253.386" fill="#000" font-size="14"> </text><text x="854" y="269.683" fill="#000" font-size="14" textLength="185.678">Action SMTP / limites / TLS</text><text x="854" y="285.979" fill="#000" font-size="14" textLength="251.398">Activation des contrôles de sécurité</text></g><!--entity Sender--><g class="entity" data-qualified-name="Sender" id="ent0001" data-source-line="8"><rect x="7" y="372.797" width="170.145" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="395.792" fill="#000" font-size="14" textLength="150.145">Serveur SMTP distant</text><text x="17" y="412.089" fill="#000" font-size="14" textLength="93.516">203.0.113.25</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="38"><path d="M237,43.297 L237,83.563 L538.725,83.563 L538.725,53.297 L528.725,43.297 L237,43.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M528.725,43.297 L528.725,53.297 L538.725,53.297 L528.725,43.297" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="243" y="60.364" fill="#000" font-size="13" textLength="280.725">HAT = contrôle du serveur SMTP connecté.</text><text x="243" y="75.497" fill="#000" font-size="13" textLength="270.702">Ce n'est pas le From: visible du message.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="43"><path d="M1476.5,43.297 L1476.5,83.563 A0,0 0 0 0 1476.5,83.563 L1611,83.563 L1615,189.647 L1619,83.563 L1752.447,83.563 A0,0 0 0 0 1752.447,83.563 L1752.447,53.297 L1742.447,43.297 L1476.5,43.297 A0,0 0 0 0 1476.5,43.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1742.447,43.297 L1742.447,53.297 L1752.447,53.297 L1742.447,43.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1482.5" y="60.364" fill="#000" font-size="13" textLength="254.947">RAT = contrôle de la destination SMTP.</text><text x="1482.5" y="75.497" fill="#000" font-size="13" textLength="228.77">Ce n'est ni l'antispam ni l'antivirus.</text></g><!--link HATCRIT to SG--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk8" data-source-line="19" data-link-type="dependency"><path d="M476.6,252.297 C515.01,252.297 554.98,252.297 593.83,252.297" style="stroke:#181818;stroke-width:1;" fill="none" id="HATCRIT-to-SG"/><polygon points="598.83,252.297,589.83,248.297,593.83,252.297,589.83,256.297,598.83,252.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="432.71" y="265.364" fill="#000" font-size="13" textLength="104