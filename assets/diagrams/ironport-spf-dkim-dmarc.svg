<g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="35"><path d="M251,403.797 L251,459.195 A0,0 0 0 0 251,459.195 L500.852,459.195 A0,0 0 0 0 500.852,459.195 L500.852,413.797 L490.852,403.797 L380,403.797 L376,368.677 L372,403.797 L251,403.797 A0,0 0 0 0 251,403.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M490.852,403.797 L490.852,413.797 L500.852,413.797 L490.852,403.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="257" y="420.864" fill="#000" font-size="13" textLength="225.627">Peut être évalué relativement tôt :</text><text x="257" y="435.997" fill="#000" font-size="13" textLength="228.852">l'IP source et l'identité d'enveloppe</text><text x="257" y="451.129" fill="#000" font-size="13" textLength="141.616">sont déjà disponibles.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="41"><path d="M251.5,168.297 L251.5,208.563 A0,0 0 0 0 251.5,208.563 L500.901,208.563 A0,0 0 0 0 500.901,208.563 L500.901,178.297 L490.901,168.297 L390,168.297 L386,133.337 L382,168.297 L251.5,168.297 A0,0 0 0 0 251.5,168.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M490.901,168.297 L490.901,178.297 L500.901,178.297 L490.901,168.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="257.5" y="185.364" fill="#000" font-size="13" textLength="228.401">Nécessite les données du message</text><text x="257.5" y="200.497" fill="#000" font-size="13" textLength="136.31">et la signature DKIM.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="46"><path d="M561,314.297 L561,354.563 A0,0 0 0 0 561,354.563 L790.768,354.563 A0,0 0 0 0 790.768,354.563 L790.768,324.297 L780.768,314.297 L680,314.297 L676,279.337 L672,314.297 L561,314.297 A0,0 0 0 0 561,314.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M780.768,314.297 L780.768,324.297 L790.768,324.297 L780.768,314.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="567" y="331.364" fill="#000" font-size="13" textLength="208.768">Évalue notamment l'alignement</text><text x="567" y="346.497" fill="#000" font-size="13" textLength="174.072">avec le domaine du From:.</text></g><!--link IP to SPF--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="24" data-link-type="dependency"><path d="M149.03,344.297 C206.66,344.297 303.19,344.297 348.3,344.297" style="stroke:#181818;stroke-width:1;" fill="none" id="IP-to-SPF"/><polygon points="353.3,344.297,344.3,340.297,348.3,344.297,344.3,348.297,353.3,344.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link MAILFROM to SPF--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-source-line="25" data-link-type="dependency"><path d="M153,403.187 C153,383.957 153,356.297 153,356.297 C153,356.297 291.7,356.297 348.39,356.297" style="stroke:#181818;stroke-width:1;" fill="none" id="MAILFROM-to-SPF"/><polygon points="353.39,356.297,344.39,352.297,348.39,356.297,344.39,360.297,353.39,356.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link SIGN to DKIM--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" id="lnk13" data-source-line="27" data-link-type="dependency"><path d="M171.77,106.297 C227.9,106.297 301.41,106.297 342.83,106.297" style="stroke:#181818;stroke-width:1;" fill="none" id="SIGN-to-DKIM"/><polygon points="347.83,106.297,338.83,102.297,342.83,106.297,338.83,110.297,347.83,106.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link BODY to DKIM--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" id="lnk14" data-source-line="28" data-link-type="dependency"><path d="M174.29,159.297 C251.33,159.297 367,159.297 367,159.297 C367,159.297 367,150.567 367,138.447" style="stroke:#1818