y="412.792" fill="#000" font-size="14" textLength="25.382">SPF</text><text x="329.5" y="429.089" fill="#000" font-size="14" textLength="208.523">Authentifie une identité SMTP</text></g><!--entity DKIM--><g class="entity" data-qualified-name="DKIM" id="ent0010" data-source-line="22"><rect x="357.5" y="129.797" width="152.891" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="367.5" y="152.792" fill="#000" font-size="14" textLength="36.169">DKIM</text><text x="367.5" y="169.089" fill="#000" font-size="14" textLength="132.891">Vérifie la signature</text></g><!--entity DMARC--><g class="entity" data-qualified-name="DMARC" id="ent0011" data-source-line="23"><rect x="718" y="299.797" width="156.801" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="728" y="322.792" fill="#000" font-size="14" textLength="51.939">DMARC</text><text x="728" y="339.089" fill="#000" font-size="14" textLength="136.801">Vérifie l'alignement</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="37"><path d="M274,477.797 L274,533.195 A0,0 0 0 0 274,533.195 L594.14,533.195 A0,0 0 0 0 594.14,533.195 L594.14,487.797 L584.14,477.797 L438,477.797 L434,442.997 L430,477.797 L274,477.797 A0,0 0 0 0 274,477.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M584.14,477.797 L584.14,487.797 L594.14,487.797 L584.14,477.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="280" y="494.864" fill="#000" font-size="13" textLength="250.225">SPF porte principalement sur l'identité</text><text x="280" y="509.997" fill="#000" font-size="13" textLength="299.14">RFC5321.MailFrom. Avec un reverse-path nul,</text><text x="280" y="525.129" fill="#000" font-size="13" textLength="286.114">SPF définit l'identité à partir de HELO/EHLO.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="43"><path d="M279.5,217.797 L279.5,273.195 A0,0 0 0 0 279.5,273.195 L588.417,273.195 A0,0 0 0 0 588.417,273.195 L588.417,227.797 L578.417,217.797 L438,217.797 L434,182.997 L430,217.797 L279.5,217.797 A0,0 0 0 0 279.5,217.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M578.417,217.797 L578.417,227.797 L588.417,227.797 L578.417,217.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="285.5" y="234.864" fill="#000" font-size="13" textLength="287.917">DKIM nécessite le message et sa signature :</text><text x="285.5" y="249.997" fill="#000" font-size="13" textLength="229.652">il ne peut pas être validé au simple</text><text x="285.5" y="265.129" fill="#000" font-size="13" textLength="232.502">établissement de la connexion TCP.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="49"><path d="M654,388.297 L654,473.961 A0,0 0 0 0 654,473.961 L939.278,473.961 A0,0 0 0 0 939.278,473.961 L939.278,398.297 L929.278,388.297 L801,388.297 L797,353.067 L793,388.297 L654,388.297 A0,0 0 0 0 654,388.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M929.278,388.297 L929.278,398.297 L939.278,398.297 L929.278,388.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="660" y="405.364" fill="#000" font-size="13" textLength="261.206">DMARC passe si SPF OU DKIM est valide</text><text x="660" y="420.497" fill="#000" font-size="13" textLength="235.111">et aligné avec le domaine du From:.</text><text x="660" y="435.629" fill="#000" font-size="13"> </text><text x="660" y="450.762" fill="#000" font-size="13" textLength="264.278">Relaxed : même Organizational Domain.</text><text x="660" y="465.895" fill="#000" font-size="13" textLength="186.989">Strict : domaines identiques.</text></g><!--link IP to SPF--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk12" data-source-line="25" data-link-type="dependency"><path d="M160.72,397.047 C201.19,397.047 259.11,397.047 314.38,397.047" style="stroke:#181818;str