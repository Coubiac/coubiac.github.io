name: Vérifier le site Jekyll

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compiler le site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Vérifier les fichiers générés
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/search.json
          ruby -rjson -e 'd = JSON.parse(File.read("_site/search.json")); abort "Index vide" if d.empty?; abort "Type manquant" unless d.all? { |x| %w[comprendre tutoriel script].include?(x["type"]) }; puts "#{d.length} articles indexés"'
          grep -q 'data-post-card' _site/index.html
