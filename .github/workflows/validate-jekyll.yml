name: Vérifier Chirpy
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Compiler et vérifier Jekyll
        run: |
          bundle exec jekyll build
          test -s _site/index.html
          test -s _site/articles/exchange-server-journaux-logs-diagnostic/index.html
          test -s _site/assets/css/jekyll-theme-chirpy.css
